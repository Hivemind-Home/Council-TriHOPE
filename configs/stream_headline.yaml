# Headline continual-distillation stream: Qwen3-1.7B student, 12000 steps
# (~6 h on an A100 40GB / L40S). Same phase structure as stream_small with
# doubled phase lengths and seq 1024.
#
#   phase              mode       domain   steps   [start,  end]
#   general_warm       random     general   1000   [    0,   999]
#   code_recurrent     recurrent  code      3000   [ 1000,  3999]
#   novel_inject       novel      general    300   [ 4000,  4299]
#   math_recurrent     recurrent  math      3000   [ 4300,  7299]
#   medical_recurrent  recurrent  medical   2600   [ 7300,  9899]
#   code_revisit       recurrent  code       900   [ 9900, 10799]
#   mixed_tail         mixed      all 4     1200   [10800, 11999]
#
#   python train.py --config-name stream_headline
#
# Teachers default to cache mode (CE on teacher_output_text + confidence).
# For the one live logit-KD run, override:
#   teachers.mode=live  (see pilot_hf_gpu.yaml for the live teacher block —
#   nf4-quantized 30B teachers need a ≥40GB GPU alongside the student)
defaults: []

model:
  backbone: hf
  pretrained_name: Qwen/Qwen3-1.7B
  dtype: bfloat16
  trust_remote_code: false
  hf_cache_dir: null
  vocab_size: 151936
  dim: 2048
  num_layers: 28
  heads: 16
  ffn_hidden_multiplier: 4
  activation: silu
  max_seq_len: 1024
  dropout: 0.0
  gradient_checkpointing: true
  lora:
    rank: 16
    alpha: 32.0
    dropout: 0.0
    target_modules: [q, k, v, o, up, gate, down]

teachers:
  mode: cache
  num_teachers: 4
  prototype_seed_samples: 100
  # These MUST equal the teacher_id values in the Layer-C tables, otherwise
  # MetadataRouter's name lookup misses on every row.
  teacher_ids:
    general: general_teacher_deepseek_r1_distill_llama_70b
    code: code_teacher_deepseek_r1
    math: math_teacher_deepseek_r1_distill_qwen_1p5b
    medical: medical_teacher_qwen2p5_1p5b_instruct_clean
  # Used only when teachers.mode=live is set on the CLI. Every streamed
  # domain must appear here: an undeclared domain is not registered, so its
  # samples fall through to teacher index 0 and distil through the wrong
  # expert. teacher_hf.py hard-raises unless vocab_size == 151936, which
  # rules out DeepSeek-R1-Distill-Llama-70B (128256) and the 7B Qwen2.5
  # Coder/Math variants (152064) — only the 1.5B Qwen2.5 models qualify.
  # Math and medical here are exactly the models that produced the cached
  # supervision, so live-KD and cache-mode stay directly comparable.
  # Total ≈ 12 GB, which fits alongside the 1.7B student on a 40 GB card.
  pretrained:
    general:
      name: Qwen/Qwen3-4B                              # 151936, nf4 ≈ 2.4 GB
      quantization: nf4
    code:
      name: Qwen/Qwen2.5-Coder-1.5B-Instruct           # 151936, bf16 ≈ 3.1 GB
      quantization: null
    math:
      name: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B  # 151936, bf16 ≈ 3.1 GB
      quantization: null
    medical:
      name: Qwen/Qwen2.5-1.5B-Instruct                 # 151936, bf16 ≈ 3.1 GB
      quantization: null
  dtype: bfloat16
  trust_remote_code: false
  hf_cache_dir: null

distillation:
  tau: 4.0
  lambda_kd: 1.0
  lambda_ce: 1.0
  lambda_reg: 0.01
  use_teacher_confidence: true   # scales KD (inert without logit caches)
  ce_confidence_weighting: true  # scales CE — the only live route in cache mode
  confidence_floor: 0.1
  confidence_power: 1.0

regularization:
  weight_decay: 0.0
  trust_region_weight: 0.001
  anti_forgetting_weight: 0.0
  lora_sparsity_weight: 0.0001

controller:
  enabled: true
  surprise: {s_min: 0.0, s_max: 20.0, eps: 1.0e-8}
  stability: {ema_alpha: 0.1, warmup_threshold: 1.0e-6, eps: 1.0e-8}
  repetition:
    alpha_mom: 0.05
    alpha_hash: 0.1
    kappa: 5.0
    sim_threshold: 0.85
    bucket_smoothing_k: 10.0
    lookback_delta: 100
    lambda_mom: 0.3
    lambda_hash: 0.5
    lambda_ret: 0.2
    buffer_size: 1000
  policy:
    top_m_modules: 6
    surprise_high: 2.0
    repetition_low: 0.3
    repetition_medium: 0.5
    stability_high_C: 0.5
    stability_low_V: 0.3
  consolidation:
    period: 1000
    min_stability_C: 0.7
    min_repetition: 0.6
    merge_strategy: direct
    checkpoint_before_merge: false
  writer:
    top_k_granularity: rank_components
    top_k_fraction: 0.5
  ablation:
    disable_signals: []
    disable_stores: []
    use_teacher_confidence: true
    confidence_threshold: 0.3
    confidence_gate: no_p
  debug:
    force_consolidate_steps: []
    policy_override: null

data:
  source: hf
  router: metadata
  vocab_size: ${model.vocab_size}   # collator sizes logits to the MODEL vocab
  gold_policy: teacher_only        # | gold_when_available (the gold_ce ablation)
  append_eos: true
  strict_load: true         # a missing domain must fail, not warn
  shuffle_before_cap: true  # no-op here (max_rows_per_domain: null)
  domains:
    - {name: general, layer_c: hivemind-research/general-layerC-200k}
    # See stream_small.yaml: code's published bucket_id has only 3 distinct
    # values, so the recurrent phases key on a composite instead (12 buckets).
    - {name: code,    layer_c: hivemind-research/code-layerC-200k,
       bucket_columns: [subdomain, difficulty, source]}
    - {name: math,    layer_c: hivemind-research/math-layerC-200K}
    - {name: medical, layer_c: hivemind-research/medical-layerC-200k}
  split: train
  tokenizer: Qwen/Qwen3-1.7B
  max_seq_len: 1024
  teacher_logits_root: null
  hf_cache_dir: null
  max_rows_per_domain: null   # full data for the headline
  batch_size: 1
  num_workers: 0
  seed: 42

stream:
  enabled: true
  seed: null
  phases:
    - {name: general_warm,      domain: general, steps: 1000, mode: random}
    - {name: code_recurrent,    domain: code,    steps: 3000, mode: recurrent,
       recurrence: {num_buckets: 8, samples_per_bucket: 16, revisit_period: 10,
                    novel_fraction: 0.5,
                    exclude_chosen_buckets_from_background: true}}
    - {name: novel_inject,      domain: general, steps: 300,  mode: novel}
    - {name: math_recurrent,    domain: math,    steps: 3000, mode: recurrent,
       recurrence: {num_buckets: 8, samples_per_bucket: 16, revisit_period: 10,
                    novel_fraction: 0.5,
                    exclude_chosen_buckets_from_background: true}}
    # Medical is the only domain whose teacher_confidence reaches the 0.3
    # gate (mean 0.596 vs 0.82-0.88 elsewhere).
    - {name: medical_recurrent, domain: medical, steps: 2600, mode: recurrent,
       recurrence: {num_buckets: 8, samples_per_bucket: 16, revisit_period: 10,
                    novel_fraction: 0.5,
                    exclude_chosen_buckets_from_background: true}}
    # Same buckets as code_recurrent, now after TWO intervening domains.
    - {name: code_revisit,      domain: code,    steps: 900,  mode: recurrent,
       recurrence: {num_buckets: 8, samples_per_bucket: 16, revisit_period: 10,
                    reuse_from: code_recurrent}}
    - {name: mixed_tail, domains: [general, code, math, medical], steps: 1200,
       mode: mixed, weights: [0.25, 0.25, 0.25, 0.25]}

distributed:
  enabled: false            # master switch; every collective no-ops at world_size 1
  backend: nccl             # gloo for the CPU equivalence tests
  strategy: ddp             # deepspeed/fsdp are rejected at startup — see
                            # src/hivemind/distributed.py for why they void Theorem 1
  world_size: auto          # cross-checked against the launcher's WORLD_SIZE
  find_unused_parameters: false
  gradient_as_bucket_view: true
  broadcast_buffers: false
  assert_rank_consistency: 100   # 0=off; tier-1 digest every step, tier-2 state every N
  eval_mode: rank0
  consolidation_mode: replicate  # | rank0_broadcast
  on_empty_batch: fail           # | skip
  allow_world_size_change: false
  timeout_minutes: 30

train:
  steps: null               # derived from the stream (12000)
  log_interval: 50
  seed: 1337
  device: cuda
  trainable: all
  mixed_precision:
    enabled: true
    dtype: bf16

optim:
  type: adamw
  lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: 0.01
  eps: 1.0e-8
  masked: true

checkpoint:
  enabled: true
  dir: checkpoints/stream_headline
  save_every: 2000
  keep_last: 1
  keep_tagged: 4
  resume_from: null

eval:
  enabled: true
  interval: 500
  max_batches: 16
  split: validation
  batch_size: 1
  max_rows_per_domain: 256
  track_forgetting: true
  at_phase_boundaries: true
  on_consolidation: false
  exact_match:
    enabled: true
    # code is 100% gold, medical 78%, math 2% (379 rows in 20k).
    domains: [code, medical, math]
    num_samples: 64
    max_scan_rows: 20000     # independent of eval.max_rows_per_domain
    max_new_tokens: 64

profiling:
  enabled: true
  sync_cuda: false

logging:
  enabled: true
  backend: json
  path: logs/stream_headline_metrics.jsonl
  events_path: logs/stream_headline_events.jsonl
  project: hivemind
  run_name: stream_headline
  id: null
  resume: allow
