# Small-scale research config: 512 dim, 12 layers, 4 teachers
model:
  vocab_size: 32000
  dim: 512
  num_layers: 12
  heads: 8
  ffn_hidden_multiplier: 4
  activation: silu
  max_seq_len: 512
  dropout: 0.0
  gradient_checkpointing: false
  lora:
    rank: 8
    alpha: 16.0
    dropout: 0.0
    target_modules: [q, k, v, o, up, gate, down]

teachers:
  num_teachers: 4
  prototype_seed_samples: 100

distillation:
  tau: 4.0
  lambda_kd: 1.0
  lambda_ce: 0.5
  lambda_reg: 0.01

regularization:
  weight_decay: 0.01
  trust_region_weight: 0.001
  anti_forgetting_weight: 0.0
  lora_sparsity_weight: 0.0001

controller:
  surprise:
    s_min: 0.0
    s_max: 20.0
    eps: 1.0e-8
  stability:
    ema_alpha: 0.1
    warmup_threshold: 1.0e-6
    eps: 1.0e-8
  repetition:
    alpha_mom: 0.05
    alpha_hash: 0.1
    kappa: 5.0
    sim_threshold: 0.85
    bucket_smoothing_k: 10.0
    lookback_delta: 100
    lambda_mom: 0.3
    lambda_hash: 0.5
    lambda_ret: 0.2
    buffer_size: 1000
  policy:
    top_m_modules: 6
    surprise_high: 2.0
    repetition_low: 0.3
    repetition_medium: 0.5
    stability_high_C: 0.5
    stability_low_V: 0.3
  consolidation:
    period: 1000
    min_stability_C: 0.7
    min_repetition: 0.6
    merge_strategy: direct
  writer:
    top_k_granularity: rank_components
    top_k_fraction: 0.5

data:
  source: synthetic
  vocab_size: 32000
  seq_len: 512
  batch_size: 4
  dataset_size: 10000
  num_workers: 2
  seed: 42

train:
  steps: 50000
  log_interval: 50
  seed: 1337
  device: auto
  mixed_precision:
    enabled: true
    dtype: bf16

optim:
  type: adamw
  lr: 3.0e-4
  betas: [0.9, 0.999]
  weight_decay: 0.01
  eps: 1.0e-8

logging:
  enabled: true
  backend: json
  path: logs/pilot_metrics.json
