# ICLR-2027 rebuttal, extra seeds, STAGE B (after stage A's shared_frozen_trihope
# runs are done): the volume-matched random and lowest-C-bar arms in the
# shared-frozen regime for seeds 42 and 314, reading the per-step commit count
# of the same seed's stage-A reference.
#
#   python scripts/run_experiment.py configs/experiments/rebuttal_seeds_sched.yaml --live --resume --concurrent 3
#
# Fails at startup (by design) if the reference commits.jsonl is missing.
experiment: rebuttal_seeds_sched
base_config: stream_small
output_root: runs
seeds: [42, 314]
cleanup_checkpoints: keep_final
_pin: &pin
  - controller.policy.surprise_high=1.25
  - controller.policy.repetition_low=0.40
  - controller.retrieval.replay_on_hit=true
_eval: &eval
  - eval.max_batches=128
  - eval.row_losses=true
runs:
  - id: shared_frozen_schedule_anti
    overrides:
      - *pin
      - *eval
      - train.trainable=routed
      - controller.debug.policy_override=schedule_anti
      - controller.debug.commit_schedule_path=runs/rebuttal_seeds_live/shared_frozen_trihope-seed${train.seed}/commits.jsonl
  - id: shared_frozen_schedule_random
    overrides:
      - *pin
      - *eval
      - train.trainable=routed
      - controller.debug.policy_override=schedule_random
      - controller.debug.commit_schedule_path=runs/rebuttal_seeds_live/shared_frozen_trihope-seed${train.seed}/commits.jsonl
