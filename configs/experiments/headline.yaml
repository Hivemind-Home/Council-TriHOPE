# Optional last tier — headline profile (Qwen3-1.7B, 12000 steps, ~6 h per
# run). Only if the GPU is idle after Tiers 1–3 (docs/GPU_RUNBOOK.md §4):
# the three runs the reframe asks for, at one seed, cache mode. Replace
# `<closest_e1_baseline>` with whichever of surprise_gate / molf_style /
# plateau_trigger sat closest to trihope on Figure 1, copying its override
# list from baselines_small.yaml. The live logit-KD check lives in
# live_kd_small.yaml (Tier 4), not here.
#   python scripts/run_experiment.py configs/experiments/headline.yaml
experiment: headline_v1
base_config: stream_headline
output_root: runs
seeds: [1337]
cleanup_checkpoints: keep_final
runs:
  - id: trihope
    overrides:
      - controller.retrieval.replay_on_hit=true
  - id: trihope_no_hash
    overrides:
      - controller.retrieval.replay_on_hit=true
      - controller.ablation.disable_signals=[repetition_hash]
  # - id: <closest_e1_baseline>
  #   overrides: [ ...copied from baselines_small.yaml... ]
