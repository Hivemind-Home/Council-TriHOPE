# CPU smoke of the schedule_* controls on stream_smoke; reference = the v1 smoke trihope run.
experiment: rebuttal_volume_smoke
base_config: stream_smoke
output_root: runs
seeds: [1337]
cleanup_checkpoints: keep_final
runs:
  - id: schedule_random
    overrides:
      - eval.row_losses=true
      - controller.debug.policy_override=schedule_random
      - controller.debug.commit_schedule_path=runs/rebuttal_smoke/trihope-seed${train.seed}/commits.jsonl
  - id: schedule_anti
    overrides:
      - eval.row_losses=true
      - controller.debug.policy_override=schedule_anti
      - controller.debug.commit_schedule_path=runs/rebuttal_smoke/trihope-seed${train.seed}/commits.jsonl
