# Group C — permanent-memory (P-store) study. Lowered consolidation
# thresholds + shortened period + recurrence-heavy stream so P fires often
# enough to measure:
#   (1) WHEN P fires        → events.jsonl decision/consolidation records
#   (2) retention/efficiency → phase_eval retention deltas, steps-to-recover
#   (3) adapter reuse        → p_study vs p_off_control AULC on math phase
#   (4) irreversible damage  → forced merges during novel/unstable phases,
#                              with pre_merge rollback checkpoints
#
# Stream phase map (stream_small) — force_consolidate_steps below are
# offsets into it, so they move whenever the phase lengths change:
#   general_warm         0- 499
#   code_recurrent     500-1999
#   novel_inject      2000-2149
#   math_recurrent    2150-3649
#   medical_recurrent 3650-4949
#   code_revisit      4950-5399
#   mixed_tail        5400-5999
#   python scripts/run_experiment.py configs/experiments/p_study_small.yaml
experiment: p_study_small_v1
base_config: stream_small
output_root: runs
seeds: [1337]
cleanup_checkpoints: keep_final
runs:
  - id: p_study
    # period 250 / min C̄ 0.4 / min R 0.4 / sustained C̄ are the stream_small
    # defaults since T1; only the routing thresholds and the merge
    # checkpoints are spec-specific now.
    overrides:
      - controller.consolidation.checkpoint_before_merge=true
      - controller.policy.repetition_medium=0.35
      - controller.policy.stability_high_C=0.35
      - controller.policy.stability_low_V=0.5
      - eval.on_consolidation=true
  - id: p_off_control
    # Same lowered routing thresholds, but the P branch is disabled — the
    # adapter-reuse and retention control.
    overrides:
      - controller.ablation.disable_stores=[P]
      - controller.policy.repetition_medium=0.35
      - controller.policy.stability_high_C=0.35
      - controller.policy.stability_low_V=0.5
  - id: p_forced_bad
    # Force-merge ALL adapters in the middle of the isolated-novel phase —
    # maximally wrong timing. Pre-merge checkpoint saved for rollback.
    # 2075 = midpoint of novel_inject (2000-2149).
    overrides:
      - controller.consolidation.checkpoint_before_merge=true
      - controller.debug.force_consolidate_steps=[2075]
      - eval.on_consolidation=true
  - id: p_forced_plausible
    # Force-merge early in math_recurrent — wrong-but-plausible timing
    # (repetition rising but stability unproven).
    # 2350 = math_recurrent start (2150) + 200.
    overrides:
      - controller.consolidation.checkpoint_before_merge=true
      - controller.debug.force_consolidate_steps=[2350]
      - eval.on_consolidation=true
  - id: p_forced_lowconf
    # Force-merge 200 steps into medical_recurrent (3650-4949) — the only
    # phase where teacher confidence dips below the 0.3 gate, i.e. the one
    # regime the confidence gate was meant to protect against consolidating.
    overrides:
      - controller.consolidation.checkpoint_before_merge=true
      - controller.debug.force_consolidate_steps=[3850]
      - eval.on_consolidation=true
