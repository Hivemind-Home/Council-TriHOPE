# Group B — routing-signal ablations (one run per signal, plus Top-M / Top-K
# sweeps). Screen at 1 seed; confirm movers at 3 seeds.
#   python scripts/run_experiment.py configs/experiments/ablation_grid.yaml
#   python -m analysis.run_report runs/ablation_grid_v1          # deltas vs the in-grid trihope
#
# Every spec ablates THE SHIPPED METHOD: the `_method` anchor carries what
# baselines_small's `trihope` sets on top of stream_small (replay on). The
# 2026-09-14 grid was run without it, i.e. against TriHOPE-without-replay
# (≈ 0.119 worst retention delta), and its "vs trihope" deltas were read
# against the wrong baseline. The in-grid `trihope` spec makes the baseline
# explicit and self-contained. To ablate the replay-off variant instead,
# change the anchor to `replay_on_hit=false` — do not mix the two.
experiment: ablation_grid_v1
base_config: stream_small
output_root: runs
seeds: [1337]
cleanup_checkpoints: keep_final
_method: &method
  - controller.retrieval.replay_on_hit=true
runs:
  - id: trihope
    # The baseline every delta is measured against (same overrides as
    # baselines_small/trihope; 1 seed here, 3 there).
    overrides:
      - *method
  - id: no_surprise
    overrides:
      - *method
      - controller.ablation.disable_signals=[surprise]
  - id: no_repetition
    overrides:
      - *method
      - controller.ablation.disable_signals=[repetition]
  - id: no_cosine
    overrides:
      - *method
      - controller.ablation.disable_signals=[cosine]
  - id: no_volatility
    overrides:
      - *method
      - controller.ablation.disable_signals=[volatility]
  - id: no_teacher_conf
    # Was a no-op by construction until the C3/C5 fixes: the 0.3 policy gate
    # cannot fire on general/code/math (p10 confidence is 0.75+ in all
    # three), and distillation.use_teacher_confidence only scaled the KD
    # mask, which is all-zero without logit caches. It now bites because
    # medical is a recurrent phase (mean confidence 0.596, 5.6% of rows
    # below the gate) and ce_confidence_weighting scales CE.
    overrides:
      - *method
      - controller.ablation.use_teacher_confidence=false
      - distillation.use_teacher_confidence=false
      - distillation.ce_confidence_weighting=false
  - id: topm_2
    overrides:
      - *method
      - ++controller.ablation.top_m_override=2
  - id: topm_all
    overrides:
      - *method
      - ++controller.ablation.top_m_override=999
  - id: topk_25
    overrides:
      - *method
      - controller.writer.top_k_fraction=0.25
  - id: topk_100
    overrides:
      - *method
      - controller.writer.top_k_fraction=1.0
  - id: stability_instant
    # T1 control: the P branch and the merge re-validation read the
    # INSTANTANEOUS cosine instead of the sustained EMA C̄ (the pre-T1
    # behaviour, under which P essentially never fires on real text).
    overrides:
      - *method
      - controller.policy.stability_source=instant
      - controller.consolidation.stability_mode=instant
  - id: consolidation_strict
    # T1 control: the strict pre-T1 consolidation bar and period.
    overrides:
      - *method
      - controller.consolidation.min_stability_C=0.7
      - controller.consolidation.min_repetition=0.6
      - controller.consolidation.period=1000
  - id: moments_optimizer
    # Signal-evidence control: read MaskedAdamW's own (exactly masked) m/v
    # instead of the controller's tracked moments. Reproduces the first
    # real-stream run: base-weight modules read m = v = 0 until P fires, so
    # surprise saturates, C̄ = 0 and P never fires (docs/CHANGELOG_iclr.md,
    # 2026-09-05). Shows why tracked moments are necessary.
    overrides:
      - *method
      - controller.moments.source=optimizer
