# ICLR-2027 rebuttal, follow-up batch (2026-11-11): VOLUME-MATCHED controls.
#
#   python scripts/run_experiment.py configs/experiments/rebuttal_volume.yaml --live --resume --concurrent 3
#
# Why: in rebuttal_v1 the live-yoked arms match commit count step for step
# within their OWN trajectory, which then diverges from the controller's.
# Measured total commits (mean of 3 seeds): trihope_e256 85, yoked_random 119,
# anti_commit 246; shared_frozen_trihope 509, shared_frozen_yoked_random 701,
# shared_frozen_anti_commit 2003. So "forgets more" there cannot be separated
# from "commits more", and the request (1Ume: same per-step count, random
# identity only; BDmh: bad selection AT THE CONTROLLER'S VOLUME) is not met.
#
# Here every arm reads the per-step commit count k_t of its seed's reference
# controller run from rebuttal_v1 (controller.debug.commit_schedule_path) and
# commits exactly k_t blocks at step t (capped at the step's non-deferred
# blocks; commit_schedule.py --reference reports the achieved ratio):
#   schedule_random: k_t uniformly random non-deferred blocks;
#   schedule_anti:   the k_t lowest-agreement (C-bar) non-deferred blocks.
# Defers, replay and the confidence gate are the arm's own controller's, as in v1.
# References: trihope_e256 (shared trainable), shared_frozen_trihope (frozen).
# Everything else (eval 256 rows, pinned thresholds, live KD) is rebuttal_v1's,
# so the v1 controller runs are the comparison and are NOT re-run.
#
# Readings, stated before any number exists (M1 = mean over domains of worst
# retention delta, seed-paired vs the same-seed reference):
#   schedule_anti > reference in 3/3 seeds, both regimes
#       -> the benchmark resolves selection at identical volume; the positive
#          control holds without the volume confound.
#   schedule_anti ~ reference
#       -> v1's anti_commit gap was volume, not selection; retract the
#          positive-control claim and say selection is undetectable at gated volume.
#   schedule_random > reference in 3/3 seeds
#       -> the controller's selection beats random at identical volume.
#   schedule_random ~ reference
#       -> v1's controller-vs-random gap was volume; selection adds nothing measurable.
#   achieved volume ratio < 0.95 in an arm -> report the shortfall with the result.
experiment: rebuttal_volume
base_config: stream_small
output_root: runs
seeds: [1337, 2024, 7]
cleanup_checkpoints: keep_final
_pin: &pin
  - controller.policy.surprise_high=1.25
  - controller.policy.repetition_low=0.40
  - controller.retrieval.replay_on_hit=true
_eval: &eval
  - eval.max_batches=128
  - eval.row_losses=true
runs:
  - id: shared_frozen_schedule_anti
    overrides:
      - *pin
      - *eval
      - train.trainable=routed
      - controller.debug.policy_override=schedule_anti
      - controller.debug.commit_schedule_path=runs/rebuttal_v1_live/shared_frozen_trihope-seed${train.seed}/commits.jsonl
  - id: schedule_anti
    overrides:
      - *pin
      - *eval
      - controller.debug.policy_override=schedule_anti
      - controller.debug.commit_schedule_path=runs/rebuttal_v1_live/trihope_e256-seed${train.seed}/commits.jsonl
  - id: shared_frozen_schedule_random
    overrides:
      - *pin
      - *eval
      - train.trainable=routed
      - controller.debug.policy_override=schedule_random
      - controller.debug.commit_schedule_path=runs/rebuttal_v1_live/shared_frozen_trihope-seed${train.seed}/commits.jsonl
  - id: schedule_random
    overrides:
      - *pin
      - *eval
      - controller.debug.policy_override=schedule_random
      - controller.debug.commit_schedule_path=runs/rebuttal_v1_live/trihope_e256-seed${train.seed}/commits.jsonl
