# Pilot config for HF-backed training.
#
# Two common shapes of this config:
#  - In-repo student (default here): small hand-rolled transformer,
#    matches Qwen2.5 vocab so tokenizer+student line up for text CE.
#  - HF student backbone: set `model.backbone: hf` and
#    `model.pretrained_name: Qwen/Qwen2.5-0.5B` (see pilot_hf_gpu.yaml
#    for an example).
#
# Mount teacher logits (NPZ) under `data.teacher_logits_root` and flip
# `distillation.lambda_kd` to 1.0 to enable logits-level KD. Until then
# the student trains on text-level CE against `teacher_output_text`.
model:
  backbone: in_repo           # "in_repo" | "hf"
  pretrained_name: null       # used when backbone=hf, e.g. Qwen/Qwen2.5-0.5B
  dtype: float32
  trust_remote_code: false
  hf_cache_dir: null
  vocab_size: 151936          # Qwen/Qwen2.5 family
  dim: 768
  num_layers: 12
  heads: 12
  ffn_hidden_multiplier: 4
  activation: silu
  max_seq_len: 2048
  dropout: 0.0
  gradient_checkpointing: false
  lora:
    rank: 16
    alpha: 32.0
    dropout: 0.0
    target_modules: [q, k, v, o, up, gate, down]

teachers:
  mode: cache                 # "cache" (NPZ logits) | "live" (HFTeacher) | "synthetic"
  num_teachers: 2
  prototype_seed_samples: 100
  teacher_ids:
    code: code_teacher_deepseek_r1
    math: math_teacher_deepseek_r1_1p5b
  # When mode=live, point each domain at a HF pretrained teacher:
  pretrained: {}              # e.g. {code: Qwen/Qwen3-Coder-30B-A3B-Instruct}
  dtype: float32
  trust_remote_code: false
  hf_cache_dir: null

distillation:
  tau: 4.0
  lambda_kd: 0.0              # set to 1.0 once NPZ logits cache is mounted
  lambda_ce: 1.0
  lambda_reg: 0.01
  use_teacher_confidence: true
  confidence_floor: 0.1       # clamp; prevents a very-low-confidence row from silently vanishing
  confidence_power: 1.0       # >1 sharpens, <1 softens

regularization:
  weight_decay: 0.01
  trust_region_weight: 0.001
  anti_forgetting_weight: 0.0
  lora_sparsity_weight: 0.0001

controller:
  surprise:
    s_min: 0.0
    s_max: 20.0
    eps: 1.0e-8
  stability:
    ema_alpha: 0.1
    warmup_threshold: 1.0e-6
    eps: 1.0e-8
  repetition:
    alpha_mom: 0.05
    alpha_hash: 0.1
    kappa: 5.0
    sim_threshold: 0.85
    bucket_smoothing_k: 10.0
    lookback_delta: 100
    lambda_mom: 0.3
    lambda_hash: 0.5
    lambda_ret: 0.2
    buffer_size: 1000
  policy:
    top_m_modules: 6
    surprise_high: 2.0
    repetition_low: 0.3
    repetition_medium: 0.5
    stability_high_C: 0.5
    stability_low_V: 0.3
  consolidation:
    period: 1000
    min_stability_C: 0.7
    min_repetition: 0.6
    merge_strategy: direct     # "direct" (fast merge) | "distill" (soft via replay)
    distill_iters: 4
    distill_lr: 1.0e-4
    distill_tau: 2.0
    distill_replay_size: 16
  writer:
    top_k_granularity: rank_components
    top_k_fraction: 0.5

data:
  source: hf
  router: metadata
  domains: [code, math]
  repo_prefix: hivemind-research
  split: train
  tokenizer: Qwen/Qwen2.5-0.5B
  max_seq_len: 2048
  teacher_logits_root: null     # e.g. /mnt/teacher_logits or s3://bucket
  hf_cache_dir: null
  streaming: false
  max_rows_per_domain: null
  batch_size: 4
  num_workers: 2
  seed: 42
  logits_cache_size: 512

train:
  steps: 50000
  log_interval: 50
  seed: 1337
  device: auto
  mixed_precision:
    enabled: true
    dtype: bf16

optim:
  type: adamw
  lr: 3.0e-4
  betas: [0.9, 0.999]
  weight_decay: 0.01
  eps: 1.0e-8

checkpoint:
  enabled: true
  dir: checkpoints/pilot_hf
  save_every: 1000
  keep_last: 3
  resume_from: null            # "latest" | step int | absolute path

eval:
  enabled: true
  interval: 500
  max_batches: 32
  split: validation
  batch_size: 4
  max_rows_per_domain: 512
  track_forgetting: true
  lora_sparsity_threshold: 1.0e-4

logging:
  enabled: true
  backend: json
  path: logs/pilot_hf_metrics.json
