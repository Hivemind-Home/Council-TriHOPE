# CPU warm-up smoke for the phased-stream pipeline: tiny in-repo student,
# REAL HF Layer-C data, cache-mode teachers (CE on teacher_output_text),
# ~2-4 min on CPU.
#
#   python train.py --config-name stream_smoke
#
# Verifies end-to-end: Layer-C loading, stream phases (random → recurrent →
# novel → cross-domain recurrent → revisit), routing decisions + event
# trace, consolidation flagging, phase-boundary eval + retention tracking,
# checkpoint + resume.
#
# math + medical are both single-file train parquets, so this stays a small
# download. Code is deliberately absent: load_dataset fetches the whole
# split before .select, and code-layerC-200k is 64 shards (~870 MB), which
# would blow the runtime contract. The composite-bucket path code needs is
# covered without any download by tests/test_stream_configs.py.
defaults: []

model:
  backbone: in_repo
  vocab_size: 151936        # must match the tokenizer below
  dim: 128
  num_layers: 2
  heads: 4
  ffn_hidden_multiplier: 4
  activation: silu
  max_seq_len: 256
  dropout: 0.0
  gradient_checkpointing: false
  lora:
    rank: 4
    alpha: 8.0
    dropout: 0.0
    target_modules: [q, k, v, o, up, gate, down]

teachers:
  mode: cache               # supervision = teacher_output_text (CE); no teacher model loaded
  num_teachers: 2
  prototype_seed_samples: 8
  # Real Layer-C teacher_id values — a mismatch makes MetadataRouter miss.
  teacher_ids:
    math: math_teacher_deepseek_r1_distill_qwen_1p5b
    medical: medical_teacher_qwen2p5_1p5b_instruct_clean

distillation:
  tau: 4.0
  lambda_kd: 1.0            # inert without logit caches (row mask all-zero)
  lambda_ce: 1.0
  lambda_reg: 0.0
  use_teacher_confidence: true   # scales KD (inert without logit caches)
  ce_confidence_weighting: true  # scales CE — the only live route in cache mode
  confidence_floor: 0.1
  confidence_power: 1.0

regularization:
  weight_decay: 0.0
  trust_region_weight: 0.0
  anti_forgetting_weight: 0.0
  lora_sparsity_weight: 0.0

controller:
  enabled: true
  policy:
    top_m_modules: 4
    surprise_high: 2.0
    repetition_low: 0.3
    repetition_medium: 0.35   # loosened so P can fire inside 60 steps
    stability_high_C: 0.3
    stability_low_V: 0.6
  consolidation:
    period: 20
    min_stability_C: 0.2
    min_repetition: 0.3
    merge_strategy: direct
    checkpoint_before_merge: true
  writer:
    top_k_granularity: rank_components
    top_k_fraction: 0.5

data:
  source: hf
  router: metadata
  vocab_size: ${model.vocab_size}   # collator sizes logits to the MODEL vocab
  gold_policy: teacher_only        # | gold_when_available (the gold_ce ablation)
  append_eos: true
  strict_load: true
  # REQUIRED at this cap: the first 2000 rows of medical hold only 14
  # buckets with ≥16 rows (17 across the full split), and general would
  # drop to 15 of 26. Shuffling first keeps the cap representative.
  shuffle_before_cap: true
  domains:
    - {name: math,    layer_c: hivemind-research/math-layerC-200K}
    - {name: medical, layer_c: hivemind-research/medical-layerC-200k}
  split: train
  tokenizer: Qwen/Qwen3-0.6B
  max_seq_len: 256
  teacher_logits_root: null
  max_rows_per_domain: 2000
  batch_size: 2
  num_workers: 0
  seed: 42

stream:
  enabled: true
  seed: null                # falls back to train.seed
  phases:
    - {name: math_warm,         domain: math,    steps: 10, mode: random}
    - {name: math_recurrent,    domain: math,    steps: 30, mode: recurrent,
       recurrence: {num_buckets: 4, samples_per_bucket: 8,
                    exclude_chosen_buckets_from_background: true}}
    - {name: novel_inject,      domain: math,    steps: 5,  mode: novel}
    # Second domain: exercises cross-domain forgetting and the low-confidence
    # regime before the revisit measures recovery.
    - {name: medical_recurrent, domain: medical, steps: 15, mode: recurrent,
       recurrence: {num_buckets: 4, samples_per_bucket: 8,
                    exclude_chosen_buckets_from_background: true}}
    - {name: math_revisit,      domain: math,    steps: 10, mode: recurrent,
       recurrence: {num_buckets: 4, samples_per_bucket: 8, reuse_from: math_recurrent}}

distributed:
  enabled: false            # master switch; every collective no-ops at world_size 1
  backend: nccl             # gloo for the CPU equivalence tests
  strategy: ddp             # deepspeed/fsdp are rejected at startup — see
                            # src/hivemind/distributed.py for why they void Theorem 1
  world_size: auto          # cross-checked against the launcher's WORLD_SIZE
  find_unused_parameters: false
  gradient_as_bucket_view: true
  broadcast_buffers: false
  assert_rank_consistency: 100   # 0=off; tier-1 digest every step, tier-2 state every N
  eval_mode: rank0
  consolidation_mode: replicate  # | rank0_broadcast
  on_empty_batch: fail           # | skip
  allow_world_size_change: false
  timeout_minutes: 30

train:
  steps: null               # derived from the stream (70)
  log_interval: 5
  seed: 1337
  device: cpu
  trainable: all
  mixed_precision:
    enabled: false

optim:
  type: adamw
  lr: 1.0e-3
  betas: [0.9, 0.999]
  weight_decay: 0.01
  eps: 1.0e-8
  masked: true

checkpoint:
  enabled: true
  dir: checkpoints/stream_smoke
  save_every: 25
  keep_last: 2
  keep_tagged: 2
  resume_from: null

eval:
  enabled: true
  interval: 25
  max_batches: 4
  split: validation
  batch_size: 2
  max_rows_per_domain: 32
  track_forgetting: true
  at_phase_boundaries: true
  on_consolidation: true
  exact_match:
    enabled: true
    domains: [medical]        # 78% gold vs math's 2%
    num_samples: 4
    max_scan_rows: 2000
    max_new_tokens: 8

profiling:
  enabled: true
  sync_cuda: false

logging:
  enabled: true
  backend: json
  path: logs/stream_smoke_metrics.jsonl
  events_path: logs/stream_smoke_events.jsonl
