# Small-profile continual-distillation stream — the workhorse config for the
# baseline group, signal ablations, and P-store study (~1-1.5 h per run on an
# A100/L40S).
#
#   python train.py --config-name stream_small
#
# Student: Qwen3-0.6B (same tokenizer/vocab family as the 1.7B headline).
# Teachers: cache mode — supervision is CE on Layer-C teacher_output_text;
# no teacher model is loaded.
# Stream (6000 steps): general warm → code recurrent → isolated novel →
# math recurrent → medical recurrent → code revisit → mixed tail.
#
#   phase              mode       domain   steps   [start, end]
#   general_warm       random     general    500   [   0,  499]
#   code_recurrent     recurrent  code      1500   [ 500, 1999]
#   novel_inject       novel      general    150   [2000, 2149]
#   math_recurrent     recurrent  math      1500   [2150, 3649]
#   medical_recurrent  recurrent  medical   1300   [3650, 4949]
#   code_revisit       recurrent  code       450   [4950, 5399]
#   mixed_tail         mixed      all 4      600   [5400, 5999]
defaults: []

model:
  backbone: hf
  pretrained_name: Qwen/Qwen3-0.6B
  dtype: bfloat16
  trust_remote_code: false
  hf_cache_dir: null
  vocab_size: 151936
  # Ignored when backbone=hf; kept for helpers that read cfg.model.
  dim: 1024
  num_layers: 28
  heads: 16
  ffn_hidden_multiplier: 4
  activation: silu
  max_seq_len: 512
  dropout: 0.0
  gradient_checkpointing: true
  lora:
    rank: 16
    alpha: 32.0
    dropout: 0.0
    target_modules: [q, k, v, o, up, gate, down]

teachers:
  mode: cache
  num_teachers: 4
  prototype_seed_samples: 100
  # These MUST equal the teacher_id values in the Layer-C tables, otherwise
  # MetadataRouter's name lookup misses on every row.
  teacher_ids:
    general: general_teacher_deepseek_r1_distill_llama_70b
    code: code_teacher_deepseek_r1
    math: math_teacher_deepseek_r1_distill_qwen_1p5b
    medical: medical_teacher_qwen2p5_1p5b_instruct_clean
  # Used only when teachers.mode=live is set (the live-KD robustness tier,
  # configs/experiments/live_kd_small.yaml). Every streamed domain must
  # appear here: an undeclared domain is not registered, so its samples
  # fall through to teacher index 0 and distil through the wrong expert
  # (data.router_strict defaults to true in live mode, so that is an error
  # rather than a silent misroute). teacher_hf.py hard-raises unless
  # vocab_size == 151936, which rules out the models that wrote the cached
  # general and code traces (DeepSeek-R1-Distill-Llama-70B: 128256;
  # DeepSeek-R1: 129280). Live teachers therefore SCORE the cached text
  # (teacher forcing) — they do not regenerate it — and for general/code
  # the scorer is a different model from the author. Math and medical are
  # the models named in the cached teacher_id. bf16 everywhere so the run
  # does not need bitsandbytes; set general.quantization: nf4 to save ~6 GB
  # if it is installed. Total ≈ 18 GB on top of the ~12 GB student run.
  dtype: bfloat16
  trust_remote_code: false
  hf_cache_dir: null
  pretrained:
    general:
      name: Qwen/Qwen3-4B                              # 151936, bf16 ≈ 8 GB
      quantization: null
    code:
      name: Qwen/Qwen2.5-Coder-1.5B-Instruct           # 151936, bf16 ≈ 3.1 GB
      quantization: null
    math:
      name: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B  # 151936, bf16 ≈ 3.5 GB
      quantization: null
    medical:
      name: Qwen/Qwen2.5-1.5B-Instruct                 # 151936, bf16 ≈ 3.1 GB
      quantization: null

distillation:
  tau: 4.0
  lambda_kd: 1.0            # inert without logit caches; harmless to keep
  lambda_ce: 0.5   # paper setting
  lambda_reg: 0.01
  use_teacher_confidence: true   # scales KD (inert without logit caches)
  ce_confidence_weighting: true  # scales CE — the only live route in cache mode
  confidence_floor: 0.1
  confidence_power: 1.0

regularization:
  weight_decay: 0.0         # AdamW handles decoupled decay
  trust_region_weight: 0.001
  anti_forgetting_weight: 0.0
  lora_sparsity_weight: 0.0001

controller:
  enabled: true
  surprise:
    s_min: 0.0
    s_max: 20.0
    eps: 1.0e-8
  stability:
    ema_alpha: 0.1
    c_ema_alpha: 0.1          # EMA of cos(g, m) → the sustained C̄ read by policy + consolidation
    warmup_threshold: 1.0e-6
    eps: 1.0e-8
  # Where the m/v evidence comes from (controller/moments.py). `tracked`
  # keeps the controller's own bias-corrected Adam-style moments for every
  # indexed coordinate, advanced every step regardless of the write mask —
  # MoLF's universal momentum tracking, confined to the signal path. The
  # optimizer's own m/v stay exactly masked (Theorem 1 is about the update).
  # `optimizer` reads MaskedAdamW's state instead and is the ablation that
  # reproduces the dead-signal behaviour of the first real-stream run
  # (S pinned at s_max, C̄ = 0, P never fires). Stride 8 tracks every 8th
  # coordinate (≈ 0.6 GB for the 0.6B student).
  moments:
    source: tracked
    sketch_stride: 8
    bias_correct: true
  repetition:
    alpha_mom: 0.05
    alpha_hash: 0.1
    kappa: 5.0
    sim_threshold: 0.85
    bucket_smoothing_k: 10.0
    lookback_delta: 100
    lambda_mom: 0.3
    lambda_hash: 0.5
    lambda_ret: 0.2
    buffer_size: 1000
  policy:
    top_m_modules: 6
    surprise_high: 1.25   # paper setting (resolved configs in results_live/*/config.yaml)
    repetition_low: 0.40   # paper setting
    repetition_medium: 0.5
    stability_high_C: 0.5
    stability_low_V: 0.3
    # P compares the SUSTAINED cosine C̄ (EMA) against stability_high_C. The
    # instantaneous cosine is noise at any single step on real text, so with
    # `instant` P never fires and the consolidation study is a null result.
    # `stability_instant` in ablation_grid.yaml is the control.
    stability_source: sustained
  consolidation:
    # Re-validation reads C̄ too, every 250 steps, at the p_study thresholds
    # (0.4/0.4) so P fires measurably inside the 6000-step stream. The strict
    # values (0.7/0.6/1000) survive as the `consolidation_strict` ablation.
    period: 250
    min_stability_C: 0.4
    min_repetition: 0.4
    stability_mode: sustained
    merge_strategy: direct
    checkpoint_before_merge: false
  writer:
    top_k_granularity: rank_components
    top_k_fraction: 0.5
  ablation:
    disable_signals: []
    disable_stores: []
    use_teacher_confidence: true
    confidence_threshold: 0.3
    confidence_gate: no_p
  debug:
    force_consolidate_steps: []
    policy_override: null
  retrieval:
    # R → F replay (T2). Off = the R tier is write-only (the `r_terminal`
    # ablation); the trihope specs flip it on. A bucket parked in R on
    # `hit_threshold` distinct earlier steps is replayed into the fast
    # store, inside the same step, once the controller routes it non-R.
    replay_on_hit: true   # paper setting
    hit_threshold: 2
    replay_batches: 1
    replay_target: F

data:
  source: hf
  router: metadata
  vocab_size: ${model.vocab_size}   # collator sizes logits to the MODEL vocab
  gold_policy: teacher_only        # | gold_when_available (the gold_ce ablation)
  append_eos: true
  strict_load: true         # a missing domain must fail, not warn
  shuffle_before_cap: true  # sample the corpus, not the head of the parquet
  domains:
    - {name: general, layer_c: hivemind-research/general-layerC-200k}
    # code's published bucket_id has only 3 distinct values (one subdomain ×
    # 3 difficulties), too few for num_buckets: 8. `source` is a genuine
    # problem-style cluster (codeforces / atcoder / codechef / ...) and the
    # composite key yields 12 buckets, all with ≥16 rows at this cap.
    - {name: code,    layer_c: hivemind-research/code-layerC-200k,
       bucket_columns: [subdomain, difficulty, source]}
    - {name: math,    layer_c: hivemind-research/math-layerC-200K}
    - {name: medical, layer_c: hivemind-research/medical-layerC-200k}
  split: train
  tokenizer: Qwen/Qwen3-0.6B
  max_seq_len: 512
  teacher_logits_root: null
  hf_cache_dir: null
  max_rows_per_domain: 40000
  batch_size: 2
  num_workers: 0            # 0 required for exact resume
  seed: 42
  # Corrupted-teacher stream (E5, task T4). Off = the clean stream and the
  # unchanged digest. When on, whole bucket subsets + whole background steps
  # of `phase` (fraction of each) are served with a bad teacher: `shuffle`
  # swaps teacher_output_text between corrupted rows, `degrade` truncates
  # it and appends a wrong final answer. Rows carry teacher_id = tag so
  # every decision / R entry is attributed to the corrupted teacher.
  # `confidence: null` keeps each row's own confidence (E5 measures the
  # routing, not the confidence gate); 0.2 is the low-confidence arm.
  corrupt_teacher:
    enabled: false
    domain: math
    phase: math_recurrent
    fraction: 0.5
    mode: shuffle
    confidence: null
    tag: math_teacher_corrupted

stream:
  enabled: true
  seed: null
  phases:
    - {name: general_warm,      domain: general, steps: 500,  mode: random}
    - {name: code_recurrent,    domain: code,    steps: 1500, mode: recurrent,
       recurrence: {num_buckets: 8, samples_per_bucket: 16, revisit_period: 10,
                    novel_fraction: 0.5,
                    exclude_chosen_buckets_from_background: true}}
    - {name: novel_inject,      domain: general, steps: 150,  mode: novel}
    - {name: math_recurrent,    domain: math,    steps: 1500, mode: recurrent,
       recurrence: {num_buckets: 8, samples_per_bucket: 16, revisit_period: 10,
                    novel_fraction: 0.5,
                    exclude_chosen_buckets_from_background: true}}
    # Medical is the only domain whose teacher_confidence reaches the 0.3
    # gate (mean 0.596 vs 0.82-0.88 elsewhere), so the confidence machinery
    # is only measurable while this phase runs.
    - {name: medical_recurrent, domain: medical, steps: 1300, mode: recurrent,
       recurrence: {num_buckets: 8, samples_per_bucket: 16, revisit_period: 10,
                    novel_fraction: 0.5,
                    exclude_chosen_buckets_from_background: true}}
    # Same buckets as code_recurrent, now after TWO intervening domains.
    - {name: code_revisit,      domain: code,    steps: 450,  mode: recurrent,
       recurrence: {num_buckets: 8, samples_per_bucket: 16, revisit_period: 10,
                    reuse_from: code_recurrent}}
    - {name: mixed_tail, domains: [general, code, math, medical], steps: 600,
       mode: mixed, weights: [0.25, 0.25, 0.25, 0.25]}

distributed:
  enabled: false            # master switch; every collective no-ops at world_size 1
  backend: nccl             # gloo for the CPU equivalence tests
  strategy: ddp             # deepspeed/fsdp are rejected at startup — see
                            # src/hivemind/distributed.py for why they void Theorem 1
  world_size: auto          # cross-checked against the launcher's WORLD_SIZE
  find_unused_parameters: false
  gradient_as_bucket_view: true
  broadcast_buffers: false
  assert_rank_consistency: 100   # 0=off; tier-1 digest every step, tier-2 state every N
  eval_mode: rank0
  consolidation_mode: replicate  # | rank0_broadcast
  on_empty_batch: fail           # | skip
  allow_world_size_change: false
  timeout_minutes: 30

train:
  steps: null               # derived from the stream (6000)
  log_interval: 20
  seed: 1337
  device: cuda
  trainable: all
  mixed_precision:
    enabled: true
    dtype: bf16

optim:
  type: adamw
  lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: 0.01
  eps: 1.0e-8
  masked: true

checkpoint:
  enabled: true
  dir: checkpoints/stream_small
  save_every: 1000
  keep_last: 1
  keep_tagged: 4
  resume_from: null

eval:
  enabled: true
  interval: 250
  # 50-step resolution inside code_revisit so steps-to-recover (E2/E3) is
  # measurable; everywhere else the 250-step interval keeps eval cheap.
  interval_by_phase: {code_revisit: 50}
  max_batches: 16
  split: validation
  batch_size: 2
  max_rows_per_domain: 256
  track_forgetting: true
  at_phase_boundaries: true
  on_consolidation: false   # p-study manifests flip this on
  exact_match:
    enabled: true
    # code is 100% gold, medical 78%, math 2% (379 rows in 20k).
    domains: [code, medical, math]
    num_samples: 64
    max_scan_rows: 20000     # independent of eval.max_rows_per_domain
    max_new_tokens: 64

profiling:
  enabled: true
  sync_cuda: false

logging:
  enabled: true
  backend: json
  path: logs/stream_small_metrics.jsonl
  events_path: logs/stream_small_events.jsonl
  project: hivemind
  run_name: stream_small
  id: null
  resume: allow
