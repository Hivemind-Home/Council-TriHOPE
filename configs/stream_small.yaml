# Small-profile continual-distillation stream — the workhorse config for the
# baseline group, signal ablations, and P-store study (~1-1.5 h per run on an
# A100/L40S).
#
#   python train.py --config-name stream_small
#
# Student: Qwen3-0.6B (same tokenizer/vocab family as the 1.7B headline).
# Teachers: cache mode — supervision is CE on Layer-C teacher_output_text
# weighted by teacher_confidence; no teacher model is loaded.
# Stream: general warm → code recurrent → isolated novel → math recurrent →
# code revisit → mixed tail (6000 steps).
defaults: []

model:
  backbone: hf
  pretrained_name: Qwen/Qwen3-0.6B
  dtype: bfloat16
  trust_remote_code: false
  hf_cache_dir: null
  vocab_size: 151936
  # Ignored when backbone=hf; kept for helpers that read cfg.model.
  dim: 1024
  num_layers: 28
  heads: 16
  ffn_hidden_multiplier: 4
  activation: silu
  max_seq_len: 512
  dropout: 0.0
  gradient_checkpointing: true
  lora:
    rank: 16
    alpha: 32.0
    dropout: 0.0
    target_modules: [q, k, v, o, up, gate, down]

teachers:
  mode: cache
  num_teachers: 3
  prototype_seed_samples: 100
  teacher_ids:
    general: general_teacher
    code: code_teacher
    math: math_teacher

distillation:
  tau: 4.0
  lambda_kd: 1.0            # inert without logit caches; harmless to keep
  lambda_ce: 1.0
  lambda_reg: 0.01
  use_teacher_confidence: true
  confidence_floor: 0.1
  confidence_power: 1.0

regularization:
  weight_decay: 0.0         # AdamW handles decoupled decay
  trust_region_weight: 0.001
  anti_forgetting_weight: 0.0
  lora_sparsity_weight: 0.0001

controller:
  enabled: true
  surprise:
    s_min: 0.0
    s_max: 20.0
    eps: 1.0e-8
  stability:
    ema_alpha: 0.1
    warmup_threshold: 1.0e-6
    eps: 1.0e-8
  repetition:
    alpha_mom: 0.05
    alpha_hash: 0.1
    kappa: 5.0
    sim_threshold: 0.85
    bucket_smoothing_k: 10.0
    lookback_delta: 100
    lambda_mom: 0.3
    lambda_hash: 0.5
    lambda_ret: 0.2
    buffer_size: 1000
  policy:
    top_m_modules: 6
    surprise_high: 2.0
    repetition_low: 0.3
    repetition_medium: 0.5
    stability_high_C: 0.5
    stability_low_V: 0.3
  consolidation:
    period: 1000
    min_stability_C: 0.7
    min_repetition: 0.6
    merge_strategy: direct
    checkpoint_before_merge: false
  writer:
    top_k_granularity: rank_components
    top_k_fraction: 0.5
  ablation:
    disable_signals: []
    disable_stores: []
    use_teacher_confidence: true
    confidence_threshold: 0.3
    confidence_gate: no_p
  debug:
    force_consolidate_steps: []
    policy_override: null

data:
  source: hf
  router: metadata
  domains:
    - {name: general, layer_c: hivemind-research/general-layerC-200k}
    - {name: code,    layer_c: hivemind-research/code-layerC-200k}
    - {name: math,    layer_c: hivemind-research/math-layerC-200K}
  split: train
  tokenizer: Qwen/Qwen3-0.6B
  max_seq_len: 512
  teacher_logits_root: null
  hf_cache_dir: null
  max_rows_per_domain: 40000
  batch_size: 2
  num_workers: 0            # 0 required for exact resume
  seed: 42

stream:
  enabled: true
  seed: null
  phases:
    - {name: general_warm,   domain: general, steps: 800,  mode: random}
    - {name: code_recurrent, domain: code,    steps: 1800, mode: recurrent,
       recurrence: {num_buckets: 8, samples_per_bucket: 16, revisit_period: 10,
                    novel_fraction: 0.5}}
    - {name: novel_inject,   domain: general, steps: 150,  mode: novel}
    - {name: math_recurrent, domain: math,    steps: 1800, mode: recurrent,
       recurrence: {num_buckets: 8, samples_per_bucket: 16, revisit_period: 10,
                    novel_fraction: 0.5}}
    - {name: code_revisit,   domain: code,    steps: 500,  mode: recurrent,
       recurrence: {num_buckets: 8, samples_per_bucket: 16, revisit_period: 10,
                    reuse_from: code_recurrent}}
    - {name: mixed_tail,     domains: [general, code, math], steps: 950,
       mode: mixed, weights: [0.34, 0.33, 0.33]}

train:
  steps: null               # derived from the stream (6000)
  log_interval: 20
  seed: 1337
  device: cuda
  trainable: all
  mixed_precision:
    enabled: true
    dtype: bf16

optim:
  type: adamw
  lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: 0.01
  eps: 1.0e-8
  masked: true

checkpoint:
  enabled: true
  dir: checkpoints/stream_small
  save_every: 1000
  keep_last: 1
  keep_tagged: 4
  resume_from: null

eval:
  enabled: true
  interval: 250
  max_batches: 16
  split: validation
  batch_size: 2
  max_rows_per_domain: 256
  track_forgetting: true
  at_phase_boundaries: true
  on_consolidation: false   # p-study manifests flip this on
  exact_match:
    enabled: true
    domains: [math]
    num_samples: 64
    max_new_tokens: 64

profiling:
  enabled: true
  sync_cuda: false

logging:
  enabled: true
  backend: json
  path: logs/stream_small_metrics.jsonl
  events_path: logs/stream_small_events.jsonl
  project: hivemind
  run_name: stream_small
  id: null
  resume: allow
