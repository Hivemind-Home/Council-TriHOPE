hydra:
  run:
    dir: runs/bad_teacher_small_v1/full_ft-seed1337/hydra/rank${oc.env:RANK,0}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - ++hydra.run.dir=runs/bad_teacher_small_v1/full_ft-seed1337/hydra/rank${oc.env:RANK,0}
    - hydra.mode=RUN
    task:
    - ++data.corrupt_teacher.enabled=true
    - ++controller.consolidation.checkpoint_before_merge=true
    - ++checkpoint.keep_tagged=0
    - ++checkpoint.save_before_phases=[math_recurrent]
    - ++controller.enabled=false
    - ++model.lora.rank=0
    - ++train.trainable=all
    - ++train.seed=1337
    - ++checkpoint.dir=runs/bad_teacher_small_v1/full_ft-seed1337/checkpoints
    - ++logging.path=runs/bad_teacher_small_v1/full_ft-seed1337/metrics.jsonl
    - ++logging.events_path=runs/bad_teacher_small_v1/full_ft-seed1337/events.jsonl
    - ++run.dir=runs/bad_teacher_small_v1/full_ft-seed1337
  job:
    name: train
    chdir: null
    override_dirname: ++checkpoint.dir=runs/bad_teacher_small_v1/full_ft-seed1337/checkpoints,++checkpoint.keep_tagged=0,++checkpoint.save_before_phases=[math_recurrent],++controller.consolidation.checkpoint_before_merge=true,++controller.enabled=false,++data.corrupt_teacher.enabled=true,++logging.events_path=runs/bad_teacher_small_v1/full_ft-seed1337/events.jsonl,++logging.path=runs/bad_teacher_small_v1/full_ft-seed1337/metrics.jsonl,++model.lora.rank=0,++run.dir=runs/bad_teacher_small_v1/full_ft-seed1337,++train.seed=1337,++train.trainable=all
    id: ???
    num: ???
    config_name: stream_small
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.6
    version_base: '1.3'
    cwd: /home/a6000/asif/Council-TriHOPE
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/a6000/asif/Council-TriHOPE/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/a6000/asif/Council-TriHOPE/runs/bad_teacher_small_v1/full_ft-seed1337/hydra/rank0
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
