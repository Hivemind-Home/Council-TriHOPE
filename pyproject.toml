[project]
name = "hivemind"
version = "0.1.0"
description = "Multi-Teacher Knowledge Distillation with Tri-Store (R/F/P) Memory Routing"
license = {text = "Apache-2.0"}
authors = [
  {name = "Hivemind Home", email = "jekono ekta mail"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4,<3",
  "einops>=0.7.0",
  "numpy>=1.26",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "typing-extensions>=4.9",
  "typer>=0.12",
]

[project.scripts]
hivemind = "hivemind.cli:app"

[project.optional-dependencies]
logging = [
  "wandb>=0.18.0",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.6.8",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hivemind"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
warn_return_any = false
strict_optional = true
show_error_codes = true
pretty = true
packages = ["hivemind"]
